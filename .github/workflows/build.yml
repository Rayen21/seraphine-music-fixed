name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.11.0
          run_install: false
      - name: Pnpm Cache
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: pnpm-macos-aarch64-apple-darwin
          restore-keys: pnpm-macos-aarch64-apple-darwin
      - name: Cache Cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: rust-macos-aarch64-apple-darwin-${{ hashFiles("src-tauri/Cargo.toml") }}
          restore-keys: |
            rust-macos-aarch64-apple-darwin-
            rust-macos-aarch64-apple-darwin
