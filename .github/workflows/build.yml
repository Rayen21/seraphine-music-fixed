name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

# ─── macOS build (Apple Silicon, no signing needed for personal project) ───
jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.11.0
          run_install: false

      - name: Pnpm Cache
        uses: actions/cache@v6
        with:
          path: ~/.pnpm-store
          key: 'pnpm-macos-aarch64-apple-darwin'
          restore-keys: pnpm-macos-aarch64-apple-darwin

      - name: Cache Cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: 'rust-macos-aarch64-apple-darwin'
          restore-keys: 'rust-macos-aarch64-apple-darwin'

      - name: Install Rust target
        run: rustup target add aarch64-apple-darwin

      - name: Install dependencies
        run: pnpm install --dangerously-allow-all-builds

      - name: Build Tauri bundle (release)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: tauri-apps/tauri-action@v0
        with:
          includeUpdaterJson: false
          tagName: ${{ github.ref_name }}
          releaseName: 'Seraphine Music ${{ github.ref_name }}'
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          tauriScript: pnpm tauri
          args: --target aarch64-apple-darwin
          signingOptions: "disabled"

      - name: Build Tauri bundle (dev)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: pnpm tauri build --target aarch64-apple-darwin

      - name: Upload macOS artifacts to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/**/*.dmg
            src-tauri/target/aarch64-apple-darwin/release/bundle/**/*.app.tar.gz

      - name: Upload bundle artifacts (dev)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: seraphine-music-macos-aarch64
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/**/*.dmg
            src-tauri/target/aarch64-apple-darwin/release/bundle/**/*.app.tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies (ubuntu only)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
              libasound2-dev \
              libxslt1.1 \
              libwebkit2gtk-4.1-dev \
              libayatana-appindicator3-dev \
              librsvg2-dev \
              patchelf

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.11.0
          run_install: false

      - name: Pnpm Cache
        uses: actions/cache@v6
        with:
          path: ~/.pnpm-store
          key: 'pnpm-${{ matrix.os }}-${{ matrix.target }}'
          restore-keys: pnpm-${{ matrix.os }}-${{ matrix.target }}

      - name: Cache Cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: 'rust-${{ matrix.os }}-${{ matrix.target }}'
          restore-keys: 'rust-${{ matrix.os }}-${{ matrix.target }}'

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install dependencies
        run: pnpm install --dangerously-allow-all-builds

      - name: Build Tauri bundle
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: tauri-apps/tauri-action@v0
        with:
          includeUpdaterJson: false
          tagName: ${{ github.ref_name }}
          releaseName: 'Seraphine Music ${{ github.ref_name }}'
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          tauriScript: pnpm tauri
          args: --target ${{ matrix.target }}
          signingOptions: "disabled"

      - name: Build Tauri bundle (dev)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: pnpm tauri build --target ${{ matrix.target }}

      - name: Upload bundle artifacts (dev)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: seraphine-music-${{ matrix.os }}-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.rpm
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
