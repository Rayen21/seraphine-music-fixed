name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 清理旧 CI 运行记录（仅 tag 推送时执行）
  cleanup:
    name: 清理旧 CI 记录
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - name: Delete older workflow runs
        uses: mstruebing/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 1

  # 清理旧 Releases（仅 tag 推送时执行）
  cleanup-releases:
    name: 清理旧 Releases
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Delete old release (keep latest)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 删除除最新 tag 外的所有 releases
          LATEST=$(gh release list --limit 1 --json tagName --jq '.[0].tagName')
          echo "Keeping $LATEST"
          gh release list --json tagName,name --jq '.[].tagName' | while read tag; do
            if [ "$tag" != "$LATEST" ]; then
              gh release delete "$tag" --yes 2>/dev/null || true
            fi
          done

  build:
    name: Build macOS ARM64
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.11.0
          run_install: false

      - name: Pnpm Cache
        uses: actions/cache@v6
        with:
          path: ~/.pnpm-store
          key: 'pnpm-macos-aarch64'
          restore-keys: pnpm-macos-aarch64

      - name: Cache Cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: 'rust-macos-aarch64'
          restore-keys: 'rust-macos-aarch64'

      - name: Add Rust target (Apple Silicon)
        run: rustup target add aarch64-apple-darwin

      - name: Install dependencies
        run: pnpm install --dangerously-allow-all-builds

      # 手动触发 / push：仅构建，不签名，不发布 Release
      - name: Build Tauri bundle (no signing, no release)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ''
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
          TAURI_SIGNING_BYPASS: 'true'
        run: |
          # 禁用 Tauri 签名
          export TAURI_SIGNING_PRIVATE_KEY=""
          export TAURI_SIGNING_PRIVATE_KEY_PASSWORD=""
          pnpm tauri build --target aarch64-apple-darwin

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: seraphine-music-macos-arm64
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/**/*.dmg
            src-tauri/target/aarch64-apple-darwin/release/bundle/**/*.app
