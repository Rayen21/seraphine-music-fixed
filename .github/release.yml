# GitHub 自动生成 Release Notes 的分类规则
# 文档：https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes
changelog:
  exclude:
    labels:
      - ignore-for-release
      - dependencies
    authors:
      - dependabot
  categories:
    - title: '🚀 Features'
      labels:
        - enhancement
        - feature
    - title: '🐛 Bug Fixes'
      labels:
        - bug
        - fix
    - title: '🔧 Refactor'
      labels:
        - refactor
    - title: '📚 Documentation'
      labels:
        - documentation
    - title: '🧪 Tests'
      labels:
        - test
        - tests
    - title: '⚙️ CI/Build'
      labels:
        - ci
        - build
    - title: 'Other Changes'
      labels:
        - '*'
